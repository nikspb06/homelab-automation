---
- name: Install Docker on my homelab
  hosts: homelab
  become: true
  gather_facts: true

  tasks:
    - name: Install Docker and Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-cli
          - docker-compose
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
